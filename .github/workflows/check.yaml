name: Check

on:
  push:
    branches:
      - main
      - 'renovate/**'
    paths:
      - '*.json5?'

      - '.github/workflows/check.ya?ml'

  pull_request:
    branches:
      - main
    paths:
      - '*.json5?'

      - '.github/workflows/check.ya?ml'

  workflow_call:
  workflow_dispatch:

  schedule:
    # Also run the check every month.
    - cron: '0 0 1 * *'

jobs:
  code-quality:
    name: Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -euxo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and run renovate-config-validator
        run: |
          # Support advanced globbing patterns.
          shopt -s dotglob globstar nullglob

          # Download and run renovate-config-validator
          npx --yes --package renovate@latest -- renovate-config-validator --strict \
            ./*.json \
            ./*.json5
